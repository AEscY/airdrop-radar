name: Collect Airdrop Intel
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render
        run: |
          curl -X POST "${{ secrets.RENDER_URL }}/collect" \
            -H "Authorization: Bearer ${{ secrets.RENDER_SECRET }}"
